name: snowflake-migration-demo

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
  workflow_dispatch:

jobs:
  deploy-snowflake-changes-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Use Python 3.8.x
        uses: actions/setup-python@v2.2.1
        with:
          python-version: 3.8.x

      - name: Run schemachange
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SF_PSWD: ${{ secrets.SF_PSWD }}
        run: |
          echo "Username value: $SF_USERNAME"
          echo "Username length: ${#SF_USERNAME}"
          echo "Password length: ${#SF_PSWD}"
          pip install schemachange
          schemachange -f deploy \
          --connections-file-path connections.toml \
          --connection-name default \
          -c $SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY \
          --create-change-history-table

